name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The CPU wheel is a fraction of the size of the default CUDA build and
      # the suite needs no GPU. Installed first so that the editable install
      # below finds torch already satisfied.
      - name: Install PyTorch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install Hydra
        run: pip install -e .[dev]

      # No test reads a corpus or asks for a GPU, so this is the whole suite.
      - name: Run tests
        run: pytest -q
