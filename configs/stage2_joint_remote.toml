# STAGE 2: joint training over four German varieties -- vast.ai.
#
# ReM (Middle High German, 2.18M tokens) + ReF (Early New High German, 2.42M)
# + ReN (Middle Low German, 1.35M) + LeA/ReA (Old High German, Old Saxon, Old
# Low Franconian, 0.28M) = 6.23M annotated tokens, 887 documents.
#
# One shared POS space: 97.8% of ReF tokens and 81.1% of ReN's already carry
# tags ReM writes, and tools/map_lea_tags.py maps 80.7% of Old German onto
# HiTS, routing only the distinctions its annotation does not make. Morph is
# deliberately NOT shared -- each non-ReM corpus keeps its own morph space
# behind a prefix -- so this run tests exactly one thing: whether a shared POS
# space transfers across varieties. Morph harmonisation is a later, separate
# experiment with this run as its baseline.
#
# Trained from scratch, not warm-started: the vocabulary is new (four POS
# inventories and four morph spaces), so there is nothing to warm-start from.
#
# group_by_manuscript is ON. ReM's sigles are not manuscript-unique (M402 and
# M402Y are one book), and without it the same scribe's hand reaches both
# sides of the split.
#
#   python -m hydra.cli train --config configs/stage2_joint_remote.toml

[run]
run_dir = "runs/stage2"
seed = 1337

[data]
corpus_dir = "/workspace/data/STAGE2"
dev_fraction = 0.05
test_fraction = 0.05
split_seed = 42
split_mode = "stratified"
# hold out MANUSCRIPTS, not sigles, and let a stratum of large
# documents still be held out (see hydra/data.py)
group_by_manuscript = true
metadata_csv = "meta/stage2_metadata.csv"
max_word_len = 48
max_lemma_len = 32
chunk_len = 128
halo = 64
on_mismatch = "skip"
multi_item_upsample = 1
lemma_type_min_freq = 1
word_type_min_freq = 2
mask_prob = 0.15
num_workers = 4

[model]
d_char = 64
d_tok = 256
d_model = 512
n_slots = 8
kernel_size = 3
char_tcn_dilations = [1, 2, 4, 8]
ctx_tcn_dilations = [1, 2, 4, 8, 16]
d_dec = 256
lemma_cross_attention = true
lemma_classifier = true
ctx_self_attention = true
masked_lm = true
joint_tag = true
tag_condition = "morph+lemma"
# linear-chain CRF over the slot-0 POS sequence. §5.4 showed the cascade's
# remaining headroom is gated by POS accuracy; this models the cross-token
# label dependency the per-token heads cannot. Transitions are zero-init, so
# warm-starting s_tagcond is a no-op at step 0 and this isolates the CRF.
pos_crf = true
dropout = 0.15

[loss]
w_pos = 1.0
w_morph = 1.0
w_lemma = 1.5
w_lemma_cls = 1.0
w_mlm = 0.5
w_joint_tag = 0.5
null_weight = 0.2

[train]
# 20 OOM'd in the training BACKWARD on a 24GB 4090 (2026-09-11); 12 runs
# at ~16.9GB and matches what s_joint itself was trained at, so the
# optimisation regime stays comparable to the baseline.
batch_chunks = 12
max_epochs = 30
lr = 3e-4
lr_min = 1e-5
warmup_steps = 1000
weight_decay = 0.01
clip_norm = 1.0
amp = true
amp_dtype = "bf16"
patience = 8
min_delta = 0.0005
log_every_steps = 50

[infer]
# eval is the memory peak, not training: the lemma-classifier logits are
# (batch, 128, 8, ~36.9k) -- 2.4 GB in fp16 at batch 32, before the lemma
# grid and activations. The local 16GB run OOM'd here at its first dev
# eval (2026-09-11). Keep this well below train batch_chunks.
batch_chunks = 12
snap_lemmas = true
classifier_min_prob = 0.3
tag_cond_min_prob = 0.0
tag_cond_oracle = false
