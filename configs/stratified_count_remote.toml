# Explicit item-count head, on top of the current best model (s_crf).
#
# Item count is otherwise implicit: decoding reads slots until the first NULL
# POS. The error analysis localises the multi-item gap there -- count is right
# only ~87% of the time and the errors are UNDER-segmentation to n=1, while
# content given the count is about as good as on single-item tokens.
#
# Warm-starts s_crf, so expect init_weights missing=2 (the new head's weight
# and bias) unexpected=0. Unlike the cascade and CRF this is NOT a zero-init
# no-op: a count head with zero weights predicts a uniform count, so the
# decode path changes from step 0.
#
#   python -m hydra.cli train --config configs/stratified_count_remote.toml #       --init-weights /workspace/s_crf/model_only.pt

[run]
run_dir = "runs/PLACEHOLDER"
seed = 1337

[data]
corpus_dir = "/workspace/data/MHD"
dev_fraction = 0.05
test_fraction = 0.05
split_seed = 42
split_mode = "stratified"
metadata_csv = "meta/rem_metadata.csv"
limit_files = 0
max_word_len = 48
max_lemma_len = 32
chunk_len = 128
halo = 64
on_mismatch = "skip"
multi_item_upsample = 1
lemma_type_min_freq = 1
word_type_min_freq = 2
mask_prob = 0.15
num_workers = 4
vocab_file = "/workspace/s_crf/vocab.json"

[model]
d_char = 64
d_tok = 256
d_model = 512
n_slots = 8
kernel_size = 3
char_tcn_dilations = [1, 2, 4, 8]
ctx_tcn_dilations = [1, 2, 4, 8, 16]
d_dec = 256
lemma_cross_attention = true
lemma_classifier = true
tcn_channel_gate = false
ctx_self_attention = true
masked_lm = true
attention_pooling = false
joint_tag = true
pretrain_mlm = false
dropout = 0.15
tag_condition = "morph+lemma"
pos_crf = true
count_head = true

[loss]
w_pos = 1.0
w_morph = 1.0
w_lemma = 1.5
w_lemma_cls = 1.0
w_mlm = 0.5
w_joint_tag = 0.5
null_weight = 0.2

[train]
batch_chunks = 12
max_epochs = 30
lr = 0.0003
lr_min = 1e-05
warmup_steps = 1000
weight_decay = 0.01
clip_norm = 1.0
amp = true
patience = 8
min_delta = 0.0005
log_every_steps = 50
cls_head_lr_mult = 1.0
amp_dtype = "bf16"

[infer]
batch_chunks = 12
snap_lemmas = true
classifier_min_prob = 0.3
tag_cond_min_prob = 0.0
