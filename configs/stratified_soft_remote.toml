# Tag-condition cascade + POS CRF + SOFT conditioning -- vast.ai variant of
# configs/stratified_soft.toml. Differences from the local file:
#   * corpus_dir points at the instance's data mount
#   * vocab_file pins s_crf's vocabulary (byte-equal to s_tagcond's and
#     s_joint's; a warm start needs the embedding tables to line up exactly
#     and a silent mismatch would surface as garbage, not as an error)
#   * batch_chunks raised for 24GB (the local box is a 16GB Quadro)
#
# Warm-starts s_crf. model.tag_cond_soft adds NO parameters -- it reuses the
# tag tables the cascade already trained -- so expect "init_weights ...
# missing=0 unexpected=0", unlike the cascade (missing=6) and CRF (missing=3).
# That is the check that this config is warm-starting what it claims to.
#
#   python -m hydra.cli train --config configs/stratified_soft_remote.toml #       --init-weights /workspace/s_crf/model_only.pt

[run]
run_dir = "runs/s_soft"
seed = 1337

[data]
corpus_dir = "/workspace/data/MHD"
dev_fraction = 0.05
test_fraction = 0.05
split_seed = 42
split_mode = "stratified"
metadata_csv = "meta/rem_metadata.csv"
vocab_file = "/workspace/s_crf/vocab.json"
max_word_len = 48
max_lemma_len = 32
chunk_len = 128
halo = 64
on_mismatch = "skip"
multi_item_upsample = 1
lemma_type_min_freq = 1
word_type_min_freq = 2
mask_prob = 0.15
num_workers = 4

[model]
d_char = 64
d_tok = 256
d_model = 512
n_slots = 8
kernel_size = 3
char_tcn_dilations = [1, 2, 4, 8]
ctx_tcn_dilations = [1, 2, 4, 8, 16]
d_dec = 256
lemma_cross_attention = true
lemma_classifier = true
ctx_self_attention = true
masked_lm = true
joint_tag = true
tag_condition = "morph+lemma"
# linear-chain CRF over the slot-0 POS sequence. §5.4 showed the cascade's
# remaining headroom is gated by POS accuracy; this models the cross-token
# label dependency the per-token heads cannot. Transitions are zero-init, so
# warm-starting s_tagcond is a no-op at step 0 and this isolates the CRF.
pos_crf = true
# consume the tag DISTRIBUTION rather than one hard decision
tag_cond_soft = true
dropout = 0.15

[loss]
w_pos = 1.0
w_morph = 1.0
w_lemma = 1.5
w_lemma_cls = 1.0
w_mlm = 0.5
w_joint_tag = 0.5
null_weight = 0.2

[train]
# 20 OOM'd in the training BACKWARD on a 24GB 4090 (2026-09-11); 12 runs
# at ~16.9GB and matches what s_joint itself was trained at, so the
# optimisation regime stays comparable to the baseline.
batch_chunks = 12
max_epochs = 30
lr = 3e-4
lr_min = 1e-5
warmup_steps = 1000
weight_decay = 0.01
clip_norm = 1.0
amp = true
amp_dtype = "bf16"
patience = 8
min_delta = 0.0005
log_every_steps = 50

# ramp the hard->soft mix over ~1 epoch (1314 steps at batch_chunks=12).
# lambda=0 at step 0 makes the forward bit-identical to s_crf, so the
# blend is provably the only change against that run.
tag_cond_ramp_steps = 1300

[infer]
# eval is the memory peak, not training: the lemma-classifier logits are
# (batch, 128, 8, ~36.9k) -- 2.4 GB in fp16 at batch 32, before the lemma
# grid and activations. The local 16GB run OOM'd here at its first dev
# eval (2026-09-11). Keep this well below train batch_chunks.
batch_chunks = 12
snap_lemmas = true
classifier_min_prob = 0.3
tag_cond_min_prob = 0.0
tag_cond_oracle = false
